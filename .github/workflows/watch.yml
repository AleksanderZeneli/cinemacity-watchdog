
name: Cinema City - Diuna IMAX 70 mm

on:
  schedule:
    - cron: "8,38 * * * *"
    - cron: "21,51 * * * *"

  workflow_dispatch:
    inputs:
      force_report:
        description: "Wygeneruj raport ze wszystkich aktualnych seansów"
        type: boolean
        default: false

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Sprawdzanie repertuaru
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Przygotowanie Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdzanie seansów IMAX 70 mm
        id: watch
        env:
          FILM_PATTERN: duna
          AUDITORIUM_PATTERN: imax
          HORIZON_DAYS: "180"

        run: |
          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }}

      - name: Wysłanie powiadomienia
        if: steps.watch.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          url=$(gh issue create \
            --title "$(cat title.txt)" \
            --body-file report.md \
            --assignee "${{ github.repository_owner }}")

          echo "Utworzono powiadomienie: $url"

          gh issue close "$url" --reason completed

      - name: Zapisanie aktualnego repertuaru
        run: |
          rm -f report.md title.txt

          if git diff --quiet -- state/seen.json; then
            echo "Brak zmian w repertuarze."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/seen.json

          git commit -m "Aktualizacja repertuaru ($(TZ=Europe/Warsaw date '+%d.%m.%Y %H:%M'))"

          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done

          echo "::error::Nie udało się zapisać repertuaru."
          exit 1
